<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Atticus HRBP Dashboard</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<style>
  html,body{margin:0;padding:0;}
  body{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:#F4F6F2;}
  #loading{padding:40px;text-align:center;color:#6b7280;font-size:14px;}
  #gate{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#0F3D23;z-index:9999;padding:16px;}
  #gate .card{background:#fff;border-radius:16px;max-width:380px;width:100%;padding:28px 26px;box-shadow:0 10px 40px rgba(0,0,0,.25);}
  #gate h1{color:#0F3D23;font-size:20px;margin:0 0 4px;font-weight:800;}
  #gate p.sub{color:#6b7280;font-size:13px;margin:0 0 18px;}
  #gate input{width:100%;box-sizing:border-box;border:1px solid #d7ddd5;border-radius:9px;padding:10px 12px;font-size:14px;margin-bottom:10px;}
  #gate .btn{width:100%;border:none;border-radius:9px;padding:10px 12px;font-size:14px;font-weight:700;cursor:pointer;margin-bottom:8px;}
  #gate .primary{background:#0F3D23;color:#fff;}
  #gate .google{background:#fff;color:#1c2b22;border:1px solid #d7ddd5;}
  #gate .link{background:none;border:none;color:#0F3D23;font-size:12px;cursor:pointer;text-decoration:underline;padding:4px;}
  #gate .or{display:flex;align-items:center;gap:8px;color:#9aa49d;font-size:11px;margin:6px 0 12px;}
  #gate .or::before,#gate .or::after{content:"";flex:1;height:1px;background:#e5e9e4;}
  #gate #msg{font-size:12px;margin-top:6px;min-height:16px;}
  @media print{ .no-print{display:none !important;} #gate{display:none !important;} body{background:#fff !important;} main{width:100% !important;} *{-webkit-print-color-adjust:exact;print-color-adjust:exact;} }
</style>
</head>
<body>
<div id="gate">
  <div class="card">
    <h1>Atticus HRBP Dashboard</h1>
    <p class="sub">Sign in with your Atticus account to continue.</p>
    <button id="googleBtn" class="btn google">Continue with Google</button>
    <div class="or">or</div>
    <input id="email" type="email" placeholder="name@atticus.ph" autocomplete="username" />
    <input id="pw" type="password" placeholder="Password" autocomplete="current-password" />
    <button id="signinBtn" class="btn primary">Sign in</button>
    <button id="signupBtn" class="link">First time? Create a password</button>
    <div id="msg"></div>
  </div>
</div>
<div id="root" style="display:none"><div id="loading">Loading the Atticus HRBP dashboard…</div></div>
<script>
var REQUIRE_LOGIN = true;
var FIREBASE_CONFIG = {
  apiKey: "AIzaSyCDiRpCFctrX-P_U6NjXzsgozCoZR11bRw",
  authDomain: "hrbp-dashboard-8fc76.firebaseapp.com",
  projectId: "hrbp-dashboard-8fc76",
  appId: "1:500971119529:web:ee5f4f56b2365cbeafdab8"
};
var ALLOWED_EMAILS = ["bp@atticus.ph", "janelyn@atticus.ph"];
var ALLOWED_DOMAIN = "atticus.ph";
function __allowed(e){ e=(e||"").toLowerCase(); return ALLOWED_EMAILS.indexOf(e)>=0 || e.slice(-(ALLOWED_DOMAIN.length+1))===("@"+ALLOWED_DOMAIN); }
function __msg(t,err){ var m=document.getElementById("msg"); if(m){ m.textContent=t; m.style.color=err?"#c0392b":"#1e7d46"; } }
function __reveal(){ document.getElementById("gate").style.display="none"; document.getElementById("root").style.display=""; if(window.__mountAtticus) window.__mountAtticus(); }
(function(){
  if(!REQUIRE_LOGIN){ __reveal(); return; }
  if(!window.firebase || FIREBASE_CONFIG.apiKey.indexOf("REPLACE_")===0){
    __msg("Login isn't configured yet. Add your Firebase keys in index.html (see SECURITY-SETUP.md), then enable Google and Email/Password sign-in.", true);
    return;
  }
  try { firebase.initializeApp(FIREBASE_CONFIG); } catch(e){}
  var auth = firebase.auth();
  auth.onAuthStateChanged(function(u){
    if(!u) return;
    if(__allowed(u.email)){ __reveal(); }
    else { __msg("Access is limited to Atticus accounts (@atticus.ph).", true); auth.signOut(); }
  });
  document.getElementById("googleBtn").onclick=function(){ auth.signInWithPopup(new firebase.auth.GoogleAuthProvider()).catch(function(e){ __msg(e.message,true); }); };
  document.getElementById("signinBtn").onclick=function(){ auth.signInWithEmailAndPassword(document.getElementById("email").value.trim(), document.getElementById("pw").value).catch(function(e){ __msg(e.message,true); }); };
  document.getElementById("signupBtn").onclick=function(){ var em=document.getElementById("email").value.trim(); if(!__allowed(em)){ __msg("Sign-up is limited to @atticus.ph accounts.", true); return; } auth.createUserWithEmailAndPassword(em, document.getElementById("pw").value).then(function(){ __msg("Account created — you're signed in."); }).catch(function(e){ __msg(e.message,true); }); };
})();
</script>
